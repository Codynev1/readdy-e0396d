<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><title>NevTech AI</title><style>*{box-sizing:border-box}body{margin:0;background:#080e0c}a{color:#07806a}a:hover{color:#075c4a}</style></helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0f2f27"/><rect x="30" y="30" width="40" height="40" rx="8" fill="#109d87"/><text x="50" y="63" text-anchor="middle" font-family="Arial" font-weight="700" font-size="34" fill="#fff">N</text></svg></template>
<div>
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><iframe title="NevTech AI home" src="./nevtech-homepage.html" style="display:block;width:100%;height:100vh;border:0;background:#080e0c"></iframe></sc-if>
<sc-if value="{{ isServices }}" hint-placeholder-val="{{ false }}"><dc-import name="services" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAbout }}" hint-placeholder-val="{{ false }}"><dc-import name="about" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}"><dc-import name="contact" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isProducts }}" hint-placeholder-val="{{ false }}"><dc-import name="products" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isFaq }}" hint-placeholder-val="{{ false }}"><dc-import name="faq" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isBlog }}" hint-placeholder-val="{{ false }}"><dc-import name="blog" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isBlogArticle }}" hint-placeholder-val="{{ false }}"><dc-import name="blog-article" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isFractionalCaio }}" hint-placeholder-val="{{ false }}"><dc-import name="fractional-caio" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isRapidMvp }}" hint-placeholder-val="{{ false }}"><dc-import name="rapid-mvp" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAiProjects }}" hint-placeholder-val="{{ false }}"><dc-import name="ai-projects" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAiLeadGeneration }}" hint-placeholder-val="{{ false }}"><dc-import name="ai-lead-generation" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isUseCases }}" hint-placeholder-val="{{ false }}"><dc-import name="use-cases" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isTmobileBusiness }}" hint-placeholder-val="{{ false }}"><dc-import name="tmobile-business" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isNovaAi }}" hint-placeholder-val="{{ false }}"><dc-import name="nova-ai" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isSeoLanding }}" hint-placeholder-val="{{ false }}"><dc-import name="seo-landing" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isLegal }}" hint-placeholder-val="{{ false }}"><dc-import name="legal" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isIntakeForm }}" hint-placeholder-val="{{ false }}"><dc-import name="intake-form" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ is404 }}" hint-placeholder-val="{{ false }}"><dc-import name="404" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isSitemap }}" hint-placeholder-val="{{ false }}"><dc-import name="sitemap" hint-size="100%,100vh"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static PAGES = ['services','about','contact','products','faq','blog','blog-article','fractional-caio','rapid-mvp','ai-projects','ai-lead-generation','use-cases','tmobile-business','nova-ai','seo-landing','legal','intake-form','404','sitemap'];
  state = { page: 'home', key: 0 };
  parse() {
    const h = location.hash;
    if (!h.startsWith('#/')) return { page: 'home', anchor: '' };
    const [pathq, anchor = ''] = h.slice(2).split('#');
    const page = pathq.split('?')[0];
    return { page: Component.PAGES.includes(page) ? page : (page ? '404' : 'home'), anchor };
  }
  apply() {
    const { page, anchor } = this.parse();
    this.setState(s => ({ page, key: s.key + 1 }), () => {
      const go = () => { if (!anchor) { scrollTo(0, 0); return; } const el = document.getElementById(anchor); if (el) scrollTo(0, el.getBoundingClientRect().top + scrollY - 96); };
      setTimeout(go, 250); setTimeout(go, 900);
    });
  }
  componentDidMount() {
    this.onHash = () => this.apply();
    addEventListener('hashchange', this.onHash);
    this.onClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (/^(https?:|mailto:|tel:)/.test(href)) return;
      if (href === '#') { e.preventDefault(); scrollTo(0, 0); return; }
      if (href.startsWith('#/')) return;
      if (href.startsWith('#')) { e.preventDefault(); const el = document.getElementById(href.slice(1)); if (el) scrollTo(0, el.getBoundingClientRect().top + scrollY - 96); return; }
      const m = href.match(/^(?:\.\/)?([\w-]+)\.(?:dc\.)?html(\?[^#]*)?(#.*)?$/);
      if (!m) return;
      e.preventDefault();
      const page = m[1] === 'nevtech-homepage' ? '' : m[1];
      location.hash = page ? '#/' + page + (m[2] || '') + (m[3] || '') : '';
      if (!page) scrollTo(0, 0);
    };
    document.addEventListener('click', this.onClick, true);
    this.apply();
  }
  componentWillUnmount() { removeEventListener('hashchange', this.onHash); document.removeEventListener('click', this.onClick, true); }
  renderVals() {
    const p = this.state.page, v = { isHome: p === 'home' };
    Component.PAGES.forEach(k => { v['is' + k.split('-').map(s => s[0].toUpperCase() + s.slice(1)).join('')] = p === k; });
    return v;
  }
}
</script>
</body>
</html>
